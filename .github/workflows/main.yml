name: Shiraz Telegram Bot

on:
  schedule:
    # اجرای خودکار هر ۵ دقیقه یک‌بار در ۲۴ ساعت شبانه‌روز (و راس ساعت ۷ صبح تهران = ۰۳:۳۰ UTC)
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      send_test:
        description: 'ارسال فوری هر ۳ عکس برای تست؟ (true یا false)'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: |
          pip install requests Pillow arabic-reshaper python-bidi jdatetime pytz

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          BRS_MARKET_API_KEY: ${{ secrets.BRS_MARKET_API_KEY }}
          FORCE_TEST: ${{ github.event.inputs.send_test || 'false' }}
        run: python bot.py

      - name: Save match state to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          git diff --staged --quiet || (git commit -m "Update bot state" && git push)
